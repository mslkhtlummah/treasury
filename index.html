<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejuve: Aplikasi Peremajaan Sawit Rakyat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='8.5' font-size='9'%3E🌴%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Font judul: Ahkio. Jika punya berkas font, tambahkan @font-face {font-family:"Ahkio"; src:url(ahkio.woff2)} dan font ini otomatis dipakai. */
:root{--bg:#FFFDEE;--card:#fff;--soft:#E2FBCE;--lime:#E3EF26;--g:#076653;--dk:#0C342C;--dd:#06231D;--tx:#0C342C;--mut:#46675c;--ln:#cfe6bd}
@media (prefers-color-scheme:dark){:root{--bg:#06231D;--card:#0C342C;--soft:#0C342C;--tx:#FFFDEE;--mut:#b9d3c4;--ln:#1d5a4b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Poppins,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.ttl{font-family:"Ahkio","Poppins",sans-serif;font-weight:800;line-height:1.15;margin:0}
.w{max-width:960px;margin:0 auto;padding:0 18px}
header{background:var(--dk);color:#FFFDEE;padding:calc(12px + env(safe-area-inset-top)) 0 0;position:relative;overflow:hidden}
.logo{font:800 22px "Ahkio","Poppins",sans-serif;display:flex;gap:8px;align-items:center;padding-bottom:10px}.logo i{width:30px;height:30px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:#06231D}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}nav a{white-space:nowrap;color:#FFFDEE;text-decoration:none;font-weight:600;font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid #1d5a4b}nav a.on{background:var(--lime);color:#06231D;border-color:var(--lime)}
.palm{position:absolute;right:-10px;top:-6px;opacity:.18;color:var(--lime)}
main{padding:24px 0 48px}h2{font-size:30px;margin-bottom:4px}.sub{color:var(--mut);margin:0 0 20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:18px}.c h3{font-size:18px;margin-bottom:6px}.c p{margin:0;color:var(--mut);font-size:14px}
a.c{text-decoration:none;color:inherit;display:block}a.c:hover{border-color:var(--g)}
.btn{border:0;cursor:pointer;background:var(--lime);color:#06231D;font:700 14px Poppins;padding:11px 20px;border-radius:99px}.btn.o{background:transparent;border:2px solid var(--g);color:var(--tx)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:11px 13px;border-radius:13px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:500 14px Poppins}input[type=range]{padding:0;accent-color:var(--g)}
.out{background:var(--dd);color:#FFFDEE;border-radius:20px;padding:20px}.big{font:800 30px "Ahkio","Poppins",sans-serif;color:var(--lime)}.out small{color:#b9d3c4}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}.out .bar{background:#1d5a4b}.out .bar i{background:var(--lime)}
.chip{display:inline-block;background:var(--lime);color:#06231D;font:700 11px Poppins;padding:2px 10px;border-radius:99px}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--g)}.step.d .dot{background:var(--g);color:#fff}
.t{cursor:pointer;border-radius:16px;padding:12px;border:2px solid var(--ln);text-align:left;font:500 13px Poppins;color:#06231D}.t b{display:block;font-size:14px}
.k2{background:#F28C28}.k1{background:#F6D743}.k3{background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid var(--ln);text-align:left}
.note{font-size:12px;color:var(--mut);margin-top:12px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="palm" viewBox="0 0 120 170"><path d="M54 170C55 120 50 90 58 56h8c-6 34-2 64 2 114z" fill="currentColor"/><g fill="currentColor"><path d="M62 54C40 28 14 30 2 52c18-10 38-8 60 2z"/><path d="M62 54C84 28 110 30 118 52c-16-8-36-6-56 2z"/><path d="M62 54C50 20 30 10 12 16c20 4 34 18 50 38z"/><path d="M62 54C74 20 94 10 110 16c-18 4-32 18-48 38z"/><path d="M62 54C60 24 62 8 66 0c4 14 2 30-4 54z"/></g><circle cx="58" cy="60" r="5" fill="#F28C28"/><circle cx="68" cy="62" r="5" fill="#F28C28"/><circle cx="62" cy="68" r="5" fill="#F28C28"/></symbol></svg>
<header><svg class="palm" width="120" height="170"><use href="#palm"/></svg><div class="w"><div class="logo"><i><svg width="18" height="24"><use href="#palm"/></svg></i>Rejuve</div><nav id="nv"></nav></div></header>
<main class="w" id="v"></main>
<script>
var KEY="rejuve:v1",$=function(s){return document.querySelector(s)};
var D={p:{ha:2,um:26,lg:1,kt:1},st:0,log:[],bk:[0,0,0,0,0],pd:4000000,tp:40,ag:[{n:"Anggota contoh 1",ha:2,s:1},{n:"Anggota contoh 2",ha:3.5,s:0}]};
var S=D;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var R=function(n){return"Rp"+Math.round(n).toLocaleString("id-ID")};
/* DATA KLASTER: ganti dengan hasil analisismu. [provinsi, luas sawit rakyat ha, porsi rakyat %, produksi/ha rakyat, % tanaman tua/rusak, klaster] */
var P=[["Riau",2254421,67.5,2.46,3.39,2],["Kalimantan Barat",813467,35.78,1.76,7.11,2],["Jambi",665270,71.43,2.06,10.81,2],["Aceh",275666,55.75,1.80,8.48,2],["Kalimantan Tengah",422832,19.76,2.56,3.75,1],["Kalimantan Timur",233309,16.42,2.53,3.29,1],["Bangka Belitung",130019,44.07,2.36,.84,1],["Kalimantan Selatan",119807,24.19,2.46,.88,1],["Lampung",114727,57.5,2.18,4.39,1],["Sulawesi Barat",110434,74.36,2.25,4.46,1],["Sumatera Selatan",596134,44.91,3.12,2.33,3],["Sumatera Utara",498956,36.37,3.65,2.25,3],["Bengkulu",338992,78.36,3.06,1.3,3],["Sumatera Barat",278841,59.7,3.54,3.86,3]];
var KN={2:"Prioritas peremajaan",1:"Menengah",3:"Relatif produktif"},fl="all";
var ST=["Rekomendasi teknis","Penebangan tanaman tua","Penanaman kembali","Panen perdana"];
var BK=["Lahan legal dan bukan kawasan hutan (STDB)","Penyiapan lahan tanpa bakar (cincang dan tumbang)","Alat pemadam dasar tersedia di kebun","Anggota kelompok siaga karhutla","Laporan foto lahan sebelum dan sesudah"];
var ROUTES={"":["Beranda",home],cek:["Cek Kelayakan",cek],lacak:["Pelacak",lacak],simulasi:["Simulasi Dana",sim],peta:["Peta Prioritas",peta],bakar:["Tanpa Bakar",bakar],koperasi:["Koperasi",koperasi]};
function score(){var p=S.p,s=(p.ha>0?25:0)+(p.um>=25?30:p.um>=20?15:0)+p.lg*30+p.kt*15;return s}
function home(){var k=score();return'<h2>Halo, pekebun!</h2><p class="sub">Peremajaan sawit rakyat di satu aplikasi. Lahan yang sama, hasil lebih baik, tanpa membuka lahan baru.</p><div class="g"><div class="out"><small>Kesiapan pengajuan</small><div class="big">'+k+'%</div><div class="bar"><i style="width:'+k+'%"></i></div><small>Tahap PSR: '+(S.st>=4?"Selesai":ST[S.st])+'</small></div><div class="out"><small>Estimasi hibah</small><div class="big">'+R(Math.min(S.p.ha,4)*6e7)+'</div><small>Rp60 jt/ha, maks. 4 ha (indikatif)</small></div></div><div class="g" style="margin-top:14px">'+["cek|Cek Kelayakan|Skor kesiapan dan hibah","lacak|Pelacak Tahapan|Rekomtek sampai panen","simulasi|Simulasi Dana|Kesenjangan masa tunggu","peta|Peta Prioritas|Klaster provinsi","bakar|Tanam Tanpa Bakar|Checklist lahan","koperasi|Mode Koperasi|Pantau anggota"].map(function(x){x=x.split("|");return'<a class="c" href="#/'+x[0]+'"><h3>'+x[1]+'</h3><p>'+x[2]+'</p></a>'}).join("")+'</div>'}
function cek(){var p=S.p;return'<h2>Cek Kelayakan</h2><p class="sub">Contoh perhitungan indikatif. Ketentuan resmi mengikuti BPDP dan Ditjen Perkebunan.</p><div class="g"><div class="c"><label>Luas kebun (ha)</label><input id="ha" type="number" min="0" step="0.5" value="'+p.ha+'"><label>Umur tanaman (tahun)</label><input id="um" type="number" min="0" value="'+p.um+'"><label>Legalitas lahan (STDB)</label><select id="lg"><option value="1"'+(p.lg?" selected":"")+'>Sudah terdaftar</option><option value="0"'+(p.lg?"":" selected")+'>Belum</option></select><label>Anggota kelompok tani atau koperasi</label><select id="kt"><option value="1"'+(p.kt?" selected":"")+'>Ya</option><option value="0"'+(p.kt?"":" selected")+'>Belum</option></select></div><div class="out" id="o"></div></div>'}
function cekU(){var k=score(),p=S.p;$("#o").innerHTML='<small>Kesiapan pengajuan</small><div class="big">'+k+'%</div><div class="bar"><i style="width:'+k+'%"></i></div><p><b>'+(!p.lg?"Daftarkan kebun ke STDB lebih dulu":p.um<20?"Kebun relatif muda, cek prioritas":k>=85?"Siap diajukan":"Lengkapi dokumen yang kurang")+'</b></p><small>Estimasi hibah</small><div class="big">'+R(Math.min(p.ha,4)*6e7)+'</div>'}
function lacak(){return'<h2>Pelacak Tahapan</h2><p class="sub">Catat kemajuan peremajaan kebunmu.</p><div class="c">'+ST.map(function(t,i){return'<div class="step'+(i<S.st?" d":"")+'"><div class="dot">'+(i<S.st?"✓":i+1)+'</div><div><b>'+t+'</b><br><small style="color:var(--mut)">'+(S.log[i]||(i==S.st?"Tahap berjalan":"Menunggu"))+'</small></div></div>'}).join("")+'<div class="bar"><i style="width:'+S.st*25+'%"></i></div><div class="row"><button class="btn" id="nx"'+(S.st>=4?" disabled":"")+'>Selesaikan tahap berikutnya</button><button class="btn o" id="rs">Reset</button></div></div>'}
function sim(){return'<h2>Simulasi Masa Tunggu</h2><p class="sub">Tanaman baru butuh ±3 tahun sebelum panen. Berapa kesenjangan pendapatannya?</p><div class="g"><div class="c"><label>Pendapatan kebun per bulan (Rp)</label><input id="pd" type="number" min="0" step="500000" value="'+S.pd+'"><label>Penghasilan sela dari tumpang sari: <b id="tv">'+S.tp+'</b>%</label><input id="tp" type="range" min="0" max="100" value="'+S.tp+'"><p class="note">Dana talangan adalah usulan konsep, bukan program yang sudah ada.</p></div><div class="out" id="o"></div></div>'}
function simU(){var L=S.pd*36;$("#tv").textContent=S.tp;$("#o").innerHTML='<small>Pendapatan hilang selama 36 bulan</small><div class="big">'+R(L)+'</div><small>Kesenjangan setelah tumpang sari (usulan dana talangan)</small><div class="big">'+R(L*(1-S.tp/100))+'</div>'}
function peta(){var rows=P.filter(function(r){return fl=="all"||r[5]==fl});return'<h2>Peta Prioritas</h2><p class="sub">Klaster provinsi sentra sawit (BPS 2025, sementara). Ketuk provinsi untuk detail.</p><div class="row">'+[["all","Semua"],[2,"Prioritas"],[1,"Menengah"],[3,"Relatif produktif"]].map(function(f){return'<button class="btn'+(fl==f[0]?"":" o")+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join("")+'</div><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+rows.map(function(r,i){return'<button class="t k'+r[5]+'" data-i="'+P.indexOf(r)+'"><b>'+r[0]+'</b>'+KN[r[5]]+'</button>'}).join("")+'</div><div class="c" id="dt" style="margin-top:14px"><p>Pilih provinsi.</p></div><p class="note">Produksi/ha = produksi dibagi luas areal. Ganti data pada variabel P di kode dengan hasil klastermu.</p>'}
function bakar(){var n=S.bk.reduce(function(a,b){return a+b},0);return'<h2>Tanam Tanpa Bakar</h2><p class="sub">Checklist komitmen lahan untuk peremajaan yang ramah lingkungan.</p><div class="c"><span class="chip">'+n+'/'+BK.length+' terpenuhi</span><div class="bar"><i style="width:'+n/BK.length*100+'%"></i></div>'+BK.map(function(t,i){return'<label class="ck"><input type="checkbox" data-b="'+i+'"'+(S.bk[i]?" checked":"")+'><span>'+t+'</span></label>'}).join("")+(n==BK.length?'<p><b>Lahan siap untuk peremajaan tanpa bakar.</b></p>':"")+'</div>'}
function koperasi(){var tot=S.ag.reduce(function(a,b){return a+b.ha},0),sl=S.ag.filter(function(a){return a.s==2}).length,NS=["Belum","Proses","Selesai"];return'<h2>Mode Koperasi</h2><p class="sub">Pantau status peremajaan anggota.</p><div class="g"><div class="out"><small>Anggota</small><div class="big">'+S.ag.length+'</div><small>'+tot+' ha, '+sl+' selesai</small></div><div class="c"><label>Nama anggota</label><input id="an"><label>Luas (ha)</label><input id="ah" type="number" min="0" step="0.5" value="1"><div class="row"><button class="btn" id="ad">Tambah</button></div></div></div><div class="c" style="margin-top:14px"><table><tr><th>Nama</th><th>Ha</th><th>Status (ketuk)</th></tr>'+S.ag.map(function(a,i){return'<tr><td>'+a.n.replace(/</g,"&lt;")+'</td><td>'+a.ha+'</td><td><button class="btn o" data-s="'+i+'">'+NS[a.s]+'</button></td></tr>'}).join("")+'</table></div>'}
function go(){var r=(location.hash.replace("#/","")||"");if(!ROUTES[r])r="";$("#nv").innerHTML=Object.keys(ROUTES).map(function(k){return'<a href="#/'+k+'" class="'+(k==r?"on":"")+'">'+ROUTES[k][0]+'</a>'}).join("");$("#v").innerHTML=ROUTES[r][1]();bind(r);window.scrollTo(0,0)}
function bind(r){
if(r=="cek"){cekU();["ha","um","lg","kt"].forEach(function(i){$("#"+i).oninput=function(){S.p[i]=+this.value||0;save();cekU()}})}
if(r=="lacak"){$("#nx").onclick=function(){S.log[S.st]="Selesai "+new Date().toLocaleDateString("id-ID");S.st++;save();go()};$("#rs").onclick=function(){S.st=0;S.log=[];save();go()}}
if(r=="simulasi"){simU();$("#pd").oninput=function(){S.pd=+this.value||0;save();simU()};$("#tp").oninput=function(){S.tp=+this.value;save();simU()}}
if(r=="peta"){document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){fl=b.dataset.f=="all"?"all":+b.dataset.f;go()}});document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){var q=P[b.dataset.i];$("#dt").innerHTML='<h3>'+q[0]+'</h3><p>Klaster: <b>'+KN[q[5]]+'</b><br>Luas sawit rakyat: '+q[1].toLocaleString("id-ID")+' ha<br>Porsi sawit rakyat: '+q[2]+'%<br>Produksi/ha kebun rakyat: '+q[3]+' ton<br>Tanaman tua/rusak: '+q[4]+'%</p>'}})}
if(r=="bakar")document.querySelectorAll("[data-b]").forEach(function(c){c.onchange=function(){S.bk[c.dataset.b]=c.checked?1:0;save();go()}});
if(r=="koperasi"){$("#ad").onclick=function(){var n=$("#an").value.trim();if(n){S.ag.push({n:n,ha:+$("#ah").value||0,s:0});save();go()}};document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var a=S.ag[b.dataset.s];a.s=(a.s+1)%3;save();go()}})}}
window.onhashchange=go;go();
</script></body></html>
